# Pedestrian Waymo-16 -> nuScenes fine-tuning, 281 labelled target frames.
_BASE_CONFIG_: cfgs/triada/car/finetune/waymo16_to_nuscenes_budget_281_car.yaml

CLASS_NAMES: ['pedestrian']

DATA_CONFIG:
    CLASS_NAMES: ['pedestrian']

MODEL:
    DENSE_HEAD:
        ANCHOR_GENERATOR_CONFIG: [
            {
                'class_name': 'pedestrian',
                'anchor_sizes': [[0.91, 0.86, 1.73]],
                'anchor_rotations': [0, 1.57],
                'anchor_bottom_heights': [0],
                'align_center': False,
                'feature_map_stride': 8,
                'matched_threshold': 0.5,
                'unmatched_threshold': 0.35
            }
        ]

OPTIMIZATION:
    NUM_EPOCHS: 20
    OPTIMIZER: adam_linear
    LR: 0.001
    WEIGHT_DECAY: 0.0
