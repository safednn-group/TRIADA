# Pedestrian Waymo-16 -> KITTI fine-tuning, 37 labelled target frames.
_BASE_CONFIG_: cfgs/triada/car/finetune/waymo16_to_kitti_budget_37_car.yaml

CLASS_NAMES: ['Pedestrian']

DATA_CONFIG:
    CLASS_NAMES: ['Pedestrian']

MODEL:
    DENSE_HEAD:
        ANCHOR_GENERATOR_CONFIG: [
            {
                'class_name': 'Pedestrian',
                'anchor_sizes': [[0.8, 0.6, 1.73]],
                'anchor_rotations': [0, 1.57],
                'anchor_bottom_heights': [0],
                'align_center': False,
                'feature_map_stride': 8,
                'matched_threshold': 0.5,
                'unmatched_threshold': 0.35
            }
        ]

OPTIMIZATION:
    NUM_EPOCHS: 40
    OPTIMIZER: adam_linear
    LR: 0.001
    WEIGHT_DECAY: 0.0
