DATASET: 'NAPNuScenesDataset'
DATA_PATH: '../data/nuscenes'

VERSION: 'v1.0-trainval'
MAX_SWEEPS: 1
SET_NAN_VELOCITY_TO_ZEROS: True
FILTER_MIN_POINTS_IN_GT: 1

POINT_CLOUD_RANGE: [-75.2, -75.2, -2, 75.2, 75.2, 4]
MIN_POINTS_OF_GT: 1

NUM_POINT_FEATURES: 5

DATA_SPLIT: {
    'train': train,
    'test': val
}

GT_DATABASE_DIR: 'gt_database_1sweeps_withvelo_nap_100'
INFO_PATH: {
    'train': ['nuscenes_infos_1sweeps_train_nap_100.pkl'],
    'test': ['nuscenes_infos_1sweeps_val_nap_100.pkl']
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['gt_sampling']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          DB_INFO_PATH: ['nuscenes_dbinfos_1sweeps_withvelo_nap_100.pkl']

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.3925, 0.3925]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
}

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.1, 0.1, 0.15]
      MAX_POINTS_PER_VOXEL: 5
      MAX_NUMBER_OF_VOXELS: {
        'train': 80000,
        'test': 90000
      }
