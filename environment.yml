name: triada

channels:
  - pytorch
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
  - cmake
  - ninja
  - pybind11

  - pytorch=2.5.1=py3.10_cuda12.4_cudnn9.1.0_0
  - torchvision=0.20.1=py310_cu124
  - pytorch-cuda=12.4
  - cuda-nvcc=12.4
  - cuda-cudart-dev=12.4
  - cuda-cccl=12.4

  - numpy=1.26.4
  - scipy=1.14.1
  - scikit-image=0.22.0
  - mkl=2023.1.0
  - intel-openmp=2023.1.0

  - pip:
      - -r requirements.txt
      - spconv-cu124==2.3.8
